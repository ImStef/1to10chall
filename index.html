<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 Image Grid</title>

<style>
    /* =========================================================
       PAGE SETTINGS
       ========================================================= */

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #222;
    }

    .canvas {
        width: 1920px;
        height: 1080px;

        position: absolute;
        left: 50%;
        top: 50%;

        transform-origin: center center;
        transform: translate(-50%, -50%) scale(var(--scale));

        background: #222;
    }


    /* =========================================================
       GRID
       ========================================================= */

    .grid {
        width: 100%;
        height: 100%;

        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(2, 1fr);

        column-gap: 20px;
        row-gap: 35px;

        box-sizing: border-box;
        padding: 35px;
    }


    /* =========================================================
       EACH ITEM
       ========================================================= */

    .item {
        display: flex;
        flex-direction: column;

        min-width: 0;
        min-height: 0;
    }


    /* =========================================================
       GAME IMAGE
       ========================================================= */

    .image-box {
        width: 100%;

        aspect-ratio: 16 / 9;

        overflow: hidden;

        background: #111;

        border-radius: 14px;
    }

    .image-box img {
        width: 100%;
        height: 100%;

        display: block;

        object-fit: cover;
    }


    /* =========================================================
       RATING BUTTON
       ========================================================= */

    .rating-container {
        /*
           Only as wide as the rating text/button.
        */
        align-self: center;

        margin-top: 12px;

        padding: 6px 16px;

        border-radius: 10px;

        color: white;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: bold;

        line-height: 1;

        box-sizing: border-box;
    }


    /* =========================================================
       RATING COLORS
       ========================================================= */

    .rating-green {
        background: #39b54a;
    }

    .rating-orange {
        background: #f2a900;
    }

    .rating-red {
        background: #e53935;
    }
</style>
</head>

<body>

<div class="canvas">
    <div class="grid">


        <!-- =================================================
             ROW 1
             ================================================= -->

        <div class="item">
            <div class="image-box">
                <img src="images/ind.png" alt="">
            </div>

            <div class="rating-container rating-green">
                1/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/inv.png" alt="">
            </div>

            <div class="rating-container rating-green">
                2/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/mouse.png" alt="">
            </div>

            <div class="rating-container rating-green">
                3/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/fbc.png" alt="">
            </div>

            <div class="rating-container rating-green">
                4/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/e33.png" alt="">
            </div>

            <div class="rating-container rating-orange">
                5/10
            </div>
        </div>


        <!-- =================================================
             ROW 2
             ================================================= -->

        <div class="item">
            <div class="image-box">
                <img src="images/re4.png" alt="">
            </div>

            <div class="rating-container rating-orange">
                6/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/van.png" alt="">
            </div>

            <div class="rating-container rating-orange">
                7/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/fte.png" alt="">
            </div>

            <div class="rating-container rating-red">
                8/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/mp3.png" alt="">
            </div>

            <div class="rating-container rating-red">
                9/10
            </div>
        </div>


        <div class="item">
            <div class="image-box">
                <img src="images/wolf.png" alt="">
            </div>

            <div class="rating-container rating-red">
                10/10
            </div>
        </div>


    </div>
</div>


<script>
    function resizeCanvas() {
        const scaleX = window.innerWidth / 1920;
        const scaleY = window.innerHeight / 1080;

        const scale = Math.min(scaleX, scaleY);

        document.documentElement.style.setProperty(
            '--scale',
            scale
        );
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
</script>

</body>
</html>
